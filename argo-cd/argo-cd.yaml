apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nextjs-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/miracleCA/EKS-test.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
