apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app-deployment
  labels:
    app: website-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app

    spec:
      containers:
        - name: web-app
          image: 345470069058.dkr.ecr.eu-north-1.amazonaws.com/next-js-test:fcf777d02a9a12d42f4cfce26d0e705e8a338e3c
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
