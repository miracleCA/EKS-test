
name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and Build Application
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run linting
      - name: Run lint
        run: npm run lint

      # 6. Build Next.js application
      - name: Build application
        run: npm run build

  docker:
    name: Build and Push Docker Image
    needs: test

    # Only publish images after code reaches main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Enable Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Authenticate with Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and publish image
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/web-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/web-app:latest
